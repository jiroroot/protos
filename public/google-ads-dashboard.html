    <style>
        /* Global styles for specific visual tweaks */
        body {
            background-color: #ffffff;
            /* True canvas background */
        }

        /* Tooltip styling */
        .tooltip-popover {
            position: absolute;
            background-color: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            z-index: 5000;
        }

        .tooltip-arrow {
            position: absolute;
            width: 0;
            height: 0;
            border-left: 8px solid transparent;
            border-right: 8px solid transparent;
            border-bottom: 8px solid white;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            filter: drop-shadow(0 -1px 1px rgba(0, 0, 0, 0.05));
        }

        .cheat-font {
            font-family: 'Permanent Marker', cursive;
        }

        /* Style for the custom arrow SVG pointing RIGHT */
        .arrow-right {
            transform: rotate(0deg);
            /* Default right arrow */
        }

        /* Anchor class for Banana/Sankey */
        .ui-anchor-roi {
            position: relative;
        }

        /* Class to position the ROI pointer */
        .pointer-roi {
            position: absolute;
            top: 50%;
            left: -20px;
            transform: translate(-100%, -50%);
            z-index: 20;
            pointer-events: none;
        }
    </style>
</head>

        LABELS["High"] = LABELS["Low"];

        // =====================================================
        // MERGE: Combines LAYOUT + LABELS into renderable config
        // =====================================================
        const buildConfig = (fidelity) => {
            const labels = LABELS[fidelity] || LABELS["No"];
            return {
                sections: LAYOUT.sections.map(section => {
                    const sectionLabels = labels[section.id] || {};
                    return {
                        ...section,
                        title: sectionLabels.title || section.id,
                        description: sectionLabels.description || "",
                        rows: section.rows.map(row => ({
                            ...row,
                            cols: row.cols.map(col => {
                                const colKey = `${section.id}.${row.id}.${col.id}`;
                                const colLabels = labels[colKey] || {};
                                return {
                                    ...col,
                                    title: colLabels.title || colKey,
                                    description: colLabels.description ?? "",
                                    metrics: colLabels.metrics || null
                                };
                            })
                        }))
                    };
                })
            };
        };

        // --- Components ---

        // Real Google Charts Sankey Component
        const GoogleSankeyChart = () => {
            const chartRef = useRef(null);

            useEffect(() => {
                // 1. Load Google Charts
                const script = document.createElement('script');
                script.src = 'https://www.gstatic.com/charts/loader.js';
                script.async = true;
                script.onload = () => {
                    if (window.google) {
                        window.google.charts.load('current', { 'packages': ['sankey'] });
                        window.google.charts.setOnLoadCallback(drawChart);
                    }
                };
                document.body.appendChild(script);

                const drawChart = () => {
                    if (!chartRef.current || !window.google || !window.google.visualization) return;

                    const data = new window.google.visualization.DataTable();
                    data.addColumn('string', 'From');
                    data.addColumn('string', 'To');
                    data.addColumn('number', 'Weight');
                    data.addRows([
                        // L1 -> L2 Connections
                        ['Unaware', 'Aware', 30],
                        ['Unaware', 'Considering', 10],
                        ['Unaware', 'Action', 5],
                        ['Awareness', 'Considering', 20],
                        ['Awareness', 'Action', 5],
                        ['Consideration', 'Action', 15],
                    ]);

                    const colors = [
                        '#3b82f6', // Unaware (Blue)
                        '#ef4444', // Aware (Red)
                        '#eab308', // Considering (Yellow)
                        '#22c55e', // Action (Green)
                        '#ef4444', // Awareness (Red)
                        '#eab308'  // Consideration (Yellow)
                    ];

                    const options = {
                        height: 200,
                        sankey: {
                            node: {
                                colors: colors,
                                label: { fontName: 'sans-serif', fontSize: 12, color: '#374151' }
                            },
                            link: {
                                colorMode: 'none', // Changed to none per request
                                colors: colors
                            }
                        }
                    };

                    const chart = new window.google.visualization.Sankey(chartRef.current);
                    chart.draw(data, options);
                };

                // Cleanup
                return () => {
                    if (document.body.contains(script)) {
                        document.body.removeChild(script);
                    }
                }
            }, []);

            return <div ref={chartRef} style={{ width: '100%', height: '100%' }}></div>;
        };

            let linkUrl = "#";

            if (lowerTitle === 'apple' || lowerTitle === 'return on investment') {
                description = "This metric represents the highest-level grouping for common data types (Crisp). It combines performance metrics related to volume and velocity.";

                linkUrl = "#apple-docs";
            } else if (lowerTitle === 'banana' || lowerTitle === 'ad reach per customer journey') {

                linkUrl = "#banana-funnel";
            }

            return { title: `${title} Metric`, definition: definition, paragraph: description, linkText, linkUrl };

                                        <div key={section.id} className="mb-10">
                                            <div className="mb-4">
                                                <h2 className="text-lg font-medium text-gray-900">{section.title}</h2>
                                                {section.description && (
                                                    <p className="text-sm text-gray-500 mt-1">{section.description}</p>
                                                )}
                                            </div>

                                            <div className="flex flex-col gap-2">
                                                {section.rows.map((row) => (
                                                    <CardRow
                                                        key={row.id}
                                                        row={row}
                                                        sectionId={section.id}
                                                        openPopover={openPopover}
                                                        showCheatCodes={showCheatCodes}
                                                        fidelity={fidelity} // Pass fidelity
                                                    />
                                                ))}
                                            </div>
                                        </div>
                                    ))
                                )}
                            </main>

                            {/* Config Data Section (Inside layout now for correct width) */}
                            {/* Only show config if NOT in distributed mode, or always show? Keeping it always visible for now. */}
                            <section className="bg-gray-800 text-gray-300 py-8 border-t border-gray-700 mt-auto">
                                <div className={`mx-auto px-6 ${showCheatCodes ? '' : 'max-w-7xl'}`}>
                                    <div className="flex items-center gap-2 mb-4">
                                        <Settings size={20} />
                                        <h3 className="text-lg font-bold text-white">Page Configuration Data</h3>
                                    </div>
                                    <p className="text-sm mb-4 text-gray-400">
                                        Edit the JSON below to instantly update the layout, titles, and widget types.
                                        Copy this data to save your layout offline. Use `""` in the description field to show the column title as the description, or `"*"` to hide the description completely.
                                    </p>

                                    <div className="relative">
                                        <textarea
                                            value={jsonInput}
                                            onChange={handleJsonChange}
                                            className={`w-full h-96 font-mono text-xs bg-gray-900 p-4 rounded-lg border ${error ? 'border-red-500' : 'border-gray-700'} focus:outline-none focus:border-blue-500 text-green-400`}
                                            spellCheck="false"
                                        />
                                        {error && (
                                            <div className="absolute bottom-4 right-4 bg-red-900 text-red-200 px-3 py-1 text-xs rounded border border-red-700">
                                                {error}
                                            </div>
                                        )}
                                    </div>
                                    <div className="mt-4 flex gap-4 text-xs text-gray-500">
                                        <span>Grid Units: 12</span>
                                        <span>Supported Widgets: sankey, scorecard, scorecard-vertical, scorecard-3up, venn, cta, time-series</span>
                                    </div>
                                </div>
                            </section>
                        </div>
                    </div>

                    {/* Popover Renderer (outside main flow) */}
                    {popoverState.content && (
                        <Popover
                            content={popoverState.content}
                            targetRef={popoverState.targetRef}
                            onClose={() => setPopoverState({ content: null, targetRef: null })}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
